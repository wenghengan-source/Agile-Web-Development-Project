<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Habit Tracker</a>

        <div>
            <a class="btn btn-light btn-sm" href="/">Home</a>
            <a class="btn btn-light btn-sm" href="/contact">Contact</a>
            {% if "user_id" in session %}
                <a class="btn btn-light btn-sm" href="/dashboard">Dashboard</a>
                <a class="btn btn-light btn-sm" href="/active_habits">Active Habits</a>
                <a class="btn btn-light btn-sm" href="/calendar">Calendar</a>
                <a class="btn btn-light btn-sm" href="/friends">Friends</a>
                <a class="btn btn-light btn-sm" href="/stats">Stats</a>
                <a class="btn btn-light btn-sm" href="/stats_custom">Stats (Custom)</a>
                <a class="btn btn-light btn-sm" href="/profile">Profile</a>
                <a class="btn btn-light btn-sm" href="/profile_custom">Profile (Custom)</a>
                <a class="btn btn-light btn-sm" href="/reward">Rewards</a>
                <a class="btn btn-danger btn-sm" href="/logout">Logout</a>
            {% else %}
                <a class="btn btn-light btn-sm" href="/login">Login</a>
                <a class="btn btn-light btn-sm" href="/register">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
