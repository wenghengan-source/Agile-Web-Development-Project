<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Habit - Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

<div class="container mt-4">
    <div class="card p-4 mx-auto" style="max-width: 650px;">
        <h2>Edit Habit</h2>
        <p class="text-muted">Update your habit details.</p>

        <form method="POST">
            <div class="mb-3">
                <label>Habit Name</label>
                <input type="text" name="habit_name" class="form-control" value="{{ habit[1] }}" required>
            </div>

            <div class="mb-3">
                <label>Category</label>
                <select name="category" class="form-control">
                    <option value="Health">Health</option>
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Priority</label>
                <select name="priority" class="form-control">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ habit[4] }}</textarea>
            </div>

            <p><strong>Created Date:</strong> {{ habit[5] }}</p>

            <button class="btn btn-primary">Save Changes</button>
            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
