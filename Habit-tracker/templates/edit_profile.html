<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

<div class="auth-card">
    <div class="text-center mb-4">
        <h2>Edit Profile</h2>
        <p class="text-muted">Update your account details and keep your profile current.</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-info">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input
                type="text"
                name="name"
                class="form-control auth-input"
                required
                value="{{ user[0] if user else '' }}"
            >
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control auth-input"
                required
                value="{{ user[1] if user else '' }}"
            >
        </div>

        <div class="mb-3">
            <label>New Password</label>
            <input
                type="password"
                name="password"
                class="form-control auth-input"
                placeholder="Leave blank to keep your current password"
            >
        </div>

        <button type="submit" class="btn btn-primary w-100 auth-button">Save Changes</button>
    </form>

    <div class="text-center mt-4">
        <a href="/profile">Back to Profile</a>
    </div>

    <p class="text-center mb-0 mt-2">
        <a href="/dashboard">Return to Dashboard</a>
    </p>
</div>

</body>
</html>
