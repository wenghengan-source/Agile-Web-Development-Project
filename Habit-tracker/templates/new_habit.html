<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Habit - Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Habit Tracker</a>
        <div>
            <a class="btn btn-light btn-sm" href="/dashboard">Dashboard</a>
            <a class="btn btn-light btn-sm" href="/calendar">Calendar</a>
            <a class="btn btn-light btn-sm" href="/friends">Friends</a>
            <a class="btn btn-light btn-sm" href="/profile">Profile</a>
            <a class="btn btn-danger btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Add New Habit</h2>

    <div class="card p-4">
        <form method="POST">
            <div class="mb-3">
                <label>Habit Name</label>
                <input type="text" name="habit_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Category</label>
                <select name="category" class="form-control">
                    <option value="Health">Health</option>
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Priority</label>
                <select name="priority" class="form-control">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Notes</label>
                <textarea name="notes" class="form-control" rows="3"></textarea>
            </div>

            <button class="btn btn-primary">Save Habit</button>
            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
