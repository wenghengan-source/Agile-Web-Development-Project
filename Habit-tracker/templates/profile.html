<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Habit Tracker</a>
        <div>
            <a class="btn btn-light btn-sm" href="/dashboard">Dashboard</a>
            <a class="btn btn-light btn-sm" href="/calendar">Calendar</a>
            <a class="btn btn-light btn-sm" href="/friends">Friends</a>
            <a class="btn btn-light btn-sm" href="/profile">Profile</a>
            <a class="btn btn-danger btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Profile</h2>

    <div class="card p-4">
        <h4>User Information</h4>

        <p><strong>Name:</strong> {{ user[0] }}</p>
        <p><strong>Email:</strong> {{ user[1] }}</p>

        <hr>

        <h4>Habit Summary</h4>

        <p><strong>Total Habits:</strong> {{ total_habits }}</p>
        <p><strong>Total Completed Records:</strong> {{ completed_habits }}</p>
    </div>
</div>

</body>
</html>
