<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Habit Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

<div class="auth-card">
    <div class="text-center mb-4">
        <h2>Create Account</h2>
        <p class="text-muted">Start building better habits today.</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-info">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control auth-input" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control auth-input" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control auth-input" required>
        </div>

        <button class="btn btn-primary w-100 auth-button">Register</button>
    </form>

    <p class="text-center mt-4">
        Already have an account?
        <a href="/login">Login here</a>
    </p>

    <p class="text-center mb-0">
        <a href="/">Back to Home</a>
    </p>
</div>

</body>
</html>
